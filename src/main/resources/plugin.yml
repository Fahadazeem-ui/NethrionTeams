name: NethrionTeams
version: '1.0.0'
main: com.nethrion.teams.NethrionTeamsPlugin
api-version: '1.21'
author: Nethrion
description: Minimal vanilla-friendly team system with requests, homes, and friendly-fire control.
commands:
  team:
    description: Manage your Nethrion team.
    usage: /team <create|invite|request|accept|deny|sethome|home|delhome|pvp|info|members|leave|disband|help>
    aliases: [teams]
permissions:
  nethrionteams.admin:
    description: Administrative NethrionTeams access.
    default: op
  nethrionteams.team:
    description: Access to NethrionTeams.
    default: true
