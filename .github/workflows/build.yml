name: Build NethrionTeams

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: gradle clean build --no-daemon --no-configuration-cache --refresh-dependencies

      - name: Upload NethrionTeams JAR
        uses: actions/upload-artifact@v4
        with:
          name: NethrionTeams-JAR
          path: build/libs/NethrionTeams-*.jar
          if-no-files-found: error
