name: Build NethrionTeams

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build
        run: gradle build --no-daemon
      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: NethrionTeams
          path: build/libs/NethrionTeams-1.0.0.jar
