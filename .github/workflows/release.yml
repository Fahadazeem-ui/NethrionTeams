name: Release NovaEssential

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Ensure Gradle wrapper is executable
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew clean build --no-daemon --no-configuration-cache --refresh-dependencies

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/NovaEssential-*.jar
          generate_release_notes: true
