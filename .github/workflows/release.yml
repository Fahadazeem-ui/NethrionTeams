name: Release NethrionTeams

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: gradle clean build --no-daemon --no-configuration-cache --refresh-dependencies

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/NethrionTeams-*.jar
          generate_release_notes: true
